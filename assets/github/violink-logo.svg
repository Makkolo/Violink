</g>
<circle cx="50" cy="50" r="41.5" fill="url(#disc)" stroke="#CDB6FF" stroke-width="0.7"/>
<g clip-path="url(#inner)">
  <circle cx="50" cy="44" r="32" fill="url(#halo)"/>
  <g fill="#E9DDFF"><circle cx="28" cy="20" r="0.55"/><circle cx="72" cy="30" r="0.5"/><circle cx="84" cy="48" r="0.45"/><circle cx="16" cy="48" r="0.45"/><circle cx="60" cy="14" r="0.4"/></g>
  <path d="M50 56 C49 68 47 80 45 96" fill="none" stroke="#2F5145" stroke-width="2"/>
  <path d="M33 64 C34 74 38 84 42 96" fill="none" stroke="#2F5145" stroke-width="1.3"/>
  <use href="#leaf" transform="translate(45 92) rotate(-55) scale(0.74)"/>
  <use href="#leaf" transform="translate(49 93) rotate(46) scale(0.68)"/>
  <use href="#bud" transform="translate(33 64) rotate(-28) scale(0.6)"/>
  <use href="#flower" transform="translate(52 45) scale(1.15)" filter="url(#shadow)"/>
  <g fill="#F7EEFF" filter="url(#glow)"><circle cx="78" cy="38" r="0.9"/><circle cx="22" cy="40" r="0.8"/><circle cx="70" cy="76" r="0.7"/></g>
