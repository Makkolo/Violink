      <ellipse cx="0" cy="-9" rx="5.5" ry="6.5" fill="#FFFFFF" opacity="0.75"/>
      <path d="M0 -5 V-20 M-2 -5 C-4.5 -11 -6.5 -15 -7.5 -19 M2 -5 C4.5 -11 6.5 -15 7.5 -19" fill="none" stroke="#3E1F86" stroke-width="0.6" stroke-linecap="round"/>
      <circle cx="4" cy="-24" r="1.5" fill="#F4EFFF" opacity="0.55"/><circle cx="3.6" cy="-24.4" r="0.5" fill="#FFFFFF"/>
    </g>
    <ellipse cx="0" cy="1.2" rx="3.4" ry="2.6" fill="#F2D88A"/>
    <circle cx="0" cy="-0.6" r="3.4" fill="#1E1530"/>
    <circle cx="-1.5" cy="-0.6" r="2" fill="none" stroke="#F4EFFF" stroke-width="0.8"/>
    <circle cx="1.5" cy="-0.6" r="2" fill="none" stroke="#CDB6FF" stroke-width="0.8"/>
  </g>
