    <use href="#veins" transform="rotate(-100)" stroke="#3E1F86" stroke-width="0.45" opacity="0.55"/>
    <use href="#pet" transform="rotate(100)" fill="url(#pS)" stroke="#2A1555" stroke-width="0.5"/>
    <use href="#veins" transform="rotate(100)" stroke="#3E1F86" stroke-width="0.45" opacity="0.55"/>
